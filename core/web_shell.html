<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>$GODOT_PROJECT_NAME</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: $GODOT_SPLASH_COLOR;
      font-family: Arial, sans-serif;
    }

    #app {
      position: relative;
      width: 100%;
      height: 100%;
      background: $GODOT_SPLASH_COLOR;
    }

    #canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    #overlay {
      position: absolute;
      inset: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      background: $GODOT_SPLASH_COLOR;
    }

    #panel {
      width: min(440px, 86vw);
      text-align: center;
      color: white;
    }

    #logo {
      width: 120px;
      max-width: 28vw;
      margin: 0 auto 22px auto;
      display: block;
    }

    #title {
      font-size: 26px;
      line-height: 1.3;
      margin-bottom: 12px;
      font-weight: 500;
    }

    #subtitle {
      font-size: 14px;
      line-height: 1.5;
      opacity: 0.82;
      margin-bottom: 22px;
    }

    #start-btn {
      border: none;
      border-radius: 999px;
      padding: 14px 22px;
      font-size: 16px;
      cursor: pointer;
      background: rgba(255,255,255,0.94);
      color: #222;
    }

    #start-btn:active {
      transform: scale(0.98);
    }

    #progress-wrap {
      width: 100%;
      height: 8px;
      margin-top: 20px;
      border-radius: 999px;
      background: rgba(255,255,255,0.15);
      overflow: hidden;
      display: none;
    }

    #progress-bar {
      width: 0%;
      height: 100%;
      border-radius: 999px;
      background: rgba(255,255,255,0.95);
      transition: width 0.12s linear;
    }

    #error {
      margin-top: 14px;
      font-size: 13px;
      opacity: 0.8;
      display: none;
    }
  </style>
  $GODOT_HEAD_INCLUDE
</head>
<body>
  <div id="app">
    <canvas id="canvas"></canvas>

    <div id="overlay">
      <div id="panel">
        <img id="logo" src="$GODOT_SPLASH" alt="Loading" />
        <div id="title">Дальше... ко второй части пути</div>
        <div id="subtitle">Нажми, чтобы продолжить</div>
        <button id="start-btn">Продолжить</button>

        <div id="progress-wrap">
          <div id="progress-bar"></div>
        </div>

        <div id="error">Не удалось загрузить игру. Попробуй обновить страницу.</div>
      </div>
    </div>
  </div>

  <script src="$GODOT_URL"></script>
  <script>
    const canvas = document.getElementById("canvas");
    const overlay = document.getElementById("overlay");
    const startBtn = document.getElementById("start-btn");
    const progressWrap = document.getElementById("progress-wrap");
    const progressBar = document.getElementById("progress-bar");
    const errorEl = document.getElementById("error");

    let started = false;

    async function startGodot() {
      if (started) return;
      started = true;

      startBtn.disabled = true;
      progressWrap.style.display = "block";

      try {
        const engine = new Engine($GODOT_CONFIG);

        await engine.startGame({
          canvas: canvas,
          onProgress: function(current, total) {
            if (total > 0) {
              const percent = Math.min(100, Math.round((current / total) * 100));
              progressBar.style.width = percent + "%";
            }
          }
        });

        overlay.style.display = "none";
      } catch (err) {
        console.error(err);
        errorEl.style.display = "block";
        startBtn.disabled = false;
        started = false;
      }
    }

    startBtn.addEventListener("click", startGodot);
    startBtn.addEventListener("touchend", function(e) {
      e.preventDefault();
      startGodot();
    }, { passive: false });
  </script>
</body>
</html>
