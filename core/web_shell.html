<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>$GODOT_PROJECT_NAME</title>
<style>
  @font-face {
    font-family: 'Neucha';
    src: url('./fonts/Neucha-Regular.ttf') format('truetype');
    font-weight: normal;
    font-style: normal;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #112618;
    font-family: 'Neucha', Georgia, "Times New Roman", serif;
  }

  #app {
    position: relative;
    width: 100%;
    height: 100%;
    background:
      radial-gradient(circle at center, rgba(255,255,255,0.04), transparent 55%),
      linear-gradient(180deg, #1a3422 0%, #112618 100%);
  }

  #canvas {
    width: 100%;
    height: 100%;
    display: block;
  }

  #overlay {
    position: absolute;
    inset: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(circle at center, rgba(255,255,255,0.05), transparent 60%),
      linear-gradient(180deg, rgba(17,38,24,0.96) 0%, rgba(17,38,24,0.98) 100%);
  }

  #panel {
    width: min(520px, 88vw);
    text-align: center;
    color: #f4efe6;
    padding: 28px 24px;
  }

  #splash {
    width: 110px;
    max-width: 26vw;
    margin: 0 auto 24px auto;
    display: block;
    opacity: 0.95;
    filter: drop-shadow(0 6px 18px rgba(0,0,0,0.22));
  }

  #title {
    font-size: 29px;
    line-height: 1.45;
    font-weight: 400;
    margin-bottom: 22px;
    letter-spacing: 0.2px;
    white-space: pre-line;
  }

  #continue-btn {
    appearance: none;
    border: 1px solid rgba(244,239,230,0.26);
    background: rgba(255,255,255,0.07);
    color: #f4efe6;
    border-radius: 999px;
    padding: 13px 24px;
    font-size: 16px;
    font-family: inherit;
    cursor: pointer;
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    transition: transform 0.15s ease, background 0.15s ease, opacity 0.15s ease;
  }

  #continue-btn:active {
    transform: scale(0.985);
  }

  #continue-btn:hover {
    background: rgba(255,255,255,0.11);
  }

  #hint {
    margin-top: 14px;
    font-size: 13px;
    color: rgba(244,239,230,0.62);
    min-height: 18px;
  }

  #error {
    display: none;
    margin-top: 14px;
    font-size: 13px;
    color: rgba(255,220,220,0.9);
  }
</style>
  $GODOT_HEAD_INCLUDE
</head>
<body>
  <div id="app">
    <canvas id="canvas"></canvas>

    <div id="overlay">
      <div id="panel">
        <img id="splash" src="$GODOT_SPLASH" alt="Heart" />
        <div id="title">Это тебе и для тебя.</div>
        <button id="continue-btn">В путь</button>
        <div id="hint"></div>
        <div id="error">Не удалось загрузить игру. Попробуй обновить страницу.</div>
      </div>
    </div>
  </div>

  <script src="$GODOT_URL"></script>
  <script>
    const canvas = document.getElementById("canvas");
    const overlay = document.getElementById("overlay");
    const button = document.getElementById("continue-btn");
    const title = document.getElementById("title");
    const hint = document.getElementById("hint");
    const errorEl = document.getElementById("error");

    const resumed = window.sessionStorage.getItem("mifil_reload_after_level2") === "1";

    if (resumed) {
      title.textContent = "Половина пути пройдена, это замечательно, осталось немного.";
      button.textContent = "В путь";
    } else {
      title.textContent = "Это тебе и для тебя.";
      button.textContent = "В путь";
    }

    let started = false;

    async function startGodot() {
      if (started) return;
      started = true;

      button.disabled = true;
      button.style.opacity = "0.7";
      hint.textContent = resumed ? "Открываем продолжение..." : "Открываем путь...";

      try {
        const engine = new Engine($GODOT_CONFIG);

        await engine.startGame({
          canvas: canvas
        });

        overlay.style.display = "none";

        if (resumed) {
          window.sessionStorage.removeItem("mifil_reload_after_level2");
        }
      } catch (err) {
        console.error(err);
        errorEl.style.display = "block";
        hint.textContent = "";
        button.disabled = false;
        button.style.opacity = "1";
        started = false;
      }
    }

    button.addEventListener("click", startGodot);
    button.addEventListener("touchend", function(e) {
      e.preventDefault();
      startGodot();
    }, { passive: false });
  </script>
</body>
</html>
